name: CI

on:
  pull_request:
    branches: [dev, main, dev-users]
  push:
    branches: [dev, main, dev-users]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Casino.slnx
      - run: dotnet build Casino.slnx --no-restore -c Release -warnaserror
      # En la rama de integracion dev-users (PR hacia ella y pushes) no se corren las pruebas de integracion (tardan mucho mas que el resto):
      # se validan completas en el PR de dev-users hacia dev.
      - name: Tests (sin integracion, rama dev-users)
        if: github.base_ref == 'dev-users' || github.ref == 'refs/heads/dev-users'
        run: dotnet test Casino.slnx --no-build -c Release --filter "FullyQualifiedName!~Casino.Integration.Tests"
      - name: Tests
        if: github.base_ref != 'dev-users' && github.ref != 'refs/heads/dev-users'
        run: dotnet test Casino.slnx --no-build -c Release
      - run: dotnet format Casino.slnx --verify-no-changes --no-restore
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "tests/web/*.test.mjs"
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
